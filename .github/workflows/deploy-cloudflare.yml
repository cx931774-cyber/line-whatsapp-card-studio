name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_admin:
        description: Update existing administrator using the encrypted credential
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  update-admin:
    if: github.event_name == 'workflow_dispatch' && inputs.update_admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - run: node scripts/update-admin.mjs
        env:
          ADMIN_ACCOUNT_UPDATE: ${{ secrets.ADMIN_ACCOUNT_UPDATE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.update_admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Apply D1 migrations and deploy Worker
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
